<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./js/popup.js" defer></script>
    <script src="./js/windows.js" defer></script>
    <script src="./js/changelog.js" defer></script>
</head>


<body>
<div id="page-content">
    <div id="site-wrapper">
        <header>
            <h1 id="site-title">Website</h1>
            <nav id="navbar">
                <a onclick="openWindow('links-window')">Links</a>
                <a onclick="openWindow('changelog-window')">Changelog</a>
                <a onclick="openWindow('games-window')">Games</a>
                <a onclick="openWindow('corkboard-window')">Corkboard</a>
                <a onclick="openWindow('info-window')">Info</a>
            </nav>
        </header>

        <main>
            <section class="content-box">
                <h2>Welcome</h2>
                <p>This is my website. Giant monster.</p>

                <button class="retro-button"
                    onclick="alert('hello giant monster')">
                    Button
                </button>
            </section>
        </main>

        <div class="gif-strip">

            <img src="./gifs/gif1.gif" alt="gif1">
            <img src="./gifs/gif2.gif" alt="gif2">
            <img src="./gifs/getfirefox.gif" alt="gif3">
            <img src="./gifs/coffee.gif" alt="gif4">
        </div>

        <footer>
            Giant Monster!!
        </footer>

    </div>
</div>


<div id="popup-overlay">
    <div id="popup-box">
        <div id="popup-text"></div>
        <button class="retro-button" onclick="closePopup()">
            Close
        </button>
    </div>
</div>

<div class="desktop-window" id="links-window">
    <div class="window-header">
        <span>Links</span>
        <button class="close-btn" onclick="closeWindow('links-window')">X</button>
    </div>

    <div class="window-content">
        <ul>
            <li><a href="https://github.com/" target="_blank">GitHub</a></li>
            <li><a href="https://steamcommunity.com/" target="_blank">Steam</a></li>
        </ul>
    </div>
</div>

<div class="desktop-window" id="changelog-window">
    <div class="window-header">
        <span>Changelog</span>
        <button class="close-btn" onclick="closeWindow('changelog-window')">X</button>
    </div>

    <div class="window-content">

        <div id="changelog-container">
            Loading changelog...
        </div>

    </div>
</div>

<div class="desktop-window" id="games-window">
    <div class="window-header">
        <span>Games</span>
        <button class="close-btn" onclick="closeWindow('games-window')">X</button>
    </div>

    <div class="window-content">
        <p>Games section here.</p>
    </div>
</div>

<div class="desktop-window" id="corkboard-window">
    <div class="window-header">
        <span>Corkboard</span>
        <button class="close-btn" onclick="closeWindow('corkboard-window')">X</button>
    </div>

    <div class="window-content">
        <p>Corkboard notes.</p>
    </div>
</div>

<div class="desktop-window" id="info-window">
    <div class="window-header">
        <span>Info</span>
        <button class="close-btn" onclick="closeWindow('info-window')">X</button>
    </div>

    <div class="window-content">
        <p>Info about the site.</p>
    </div>
</div>
</body>
</html>
